<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebClass Visual Prototype Preview - 全学科版</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <aside class="sidebar">
    <div class="logo"><span class="logo-mark">W</span><strong>WebClass</strong></div>
    <nav aria-label="メインメニュー">
      <a class="active" href="#"><span class="nav-icon calendar"></span>時間割</a>
      <a href="#"><span class="nav-icon document"></span>課題・レポート</a>
      <a href="#"><span class="nav-icon bell"></span>お知らせ <b class="nav-count">3</b></a>
      <a href="#"><span class="nav-icon score"></span>成績</a>
      <a href="#"><span class="nav-icon mail"></span>メッセージ</a>
      <a href="#"><span class="nav-icon user"></span>マイページ</a>
    </nav>

    <section class="side-panel">
      <h2>表示オプション</h2>
      <label><input type="checkbox"> 時間割外を表示</label>
      <label><input type="checkbox" checked> 集中講義を表示</label>
      <hr>
      <h2>授業カテゴリ</h2>
      <ul class="legend">
        <li><span class="dot specialist"></span>専門科目</li>
        <li><span class="dot foundation"></span>基礎科目</li>
        <li><span class="dot exercise"></span>実験・演習</li>
        <li><span class="dot information"></span>情報・通信</li>
      </ul>
    </section>
  </aside>

  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="page-kicker">授業支援システム</div>
        <h1><span class="heading-icon"></span>時間割</h1>
      </div>
      <div class="top-actions">
        <button type="button">ヘルプ</button>
        <div class="account">
          <span>全学部・全研究科デモ</span>
          <strong>学生 太郎</strong>
        </div>
      </div>
    </header>

    <main>
      <section class="toolbar" aria-label="時間割操作">
        <div class="week-controls">
          <button class="primary" type="button">今週</button>
          <button class="arrow" type="button" aria-label="前週">‹</button>
          <strong>2026年5月25日（月）〜 5月30日（土）</strong>
          <button class="arrow" type="button" aria-label="次週">›</button>
        </div>
        <div class="info-actions">
          <button class="info-button" type="button"><span class="pin-icon"></span><b>教室</b><small>教室・場所を表示</small></button>
          <button class="info-button" type="button"><span class="person-icon"></span><b>担当教員</b><small>担当の先生を表示</small></button>
          <button class="change-button" type="button"><span id="changeCount">0</span><b>変更情報</b><small>教室変更などの通知</small></button>
        </div>
      </section>

      <section class="prototype-note">
        <strong>プロトタイプ表示</strong>
        <span>2026年度の全学部・全研究科時間割から担当教員・教室を表示。<span id="coverageSummary"></span> 変更バッジは見た目確認用です。</span>
      </section>

      <section class="demo-view-switcher" aria-label="収録範囲の表示例">
        <div>
          <strong id="viewTitle">世田谷キャンパス・学部</strong>
          <span id="viewDescription">理工学部等の授業表示例</span>
        </div>
        <div class="demo-tabs" role="tablist">
          <button class="active" type="button" data-view="setagaya" role="tab" aria-selected="true">世田谷・学部</button>
          <button type="button" data-view="yokohama" role="tab" aria-selected="false">横浜・学部</button>
          <button type="button" data-view="graduate" role="tab" aria-selected="false">大学院</button>
        </div>
      </section>

      <div id="timetable" class="timetable" aria-label="週間時間割"></div>
    </main>
  </div>

  <script src="../data/timetable-2026.js"></script>
  <script src="preview.js"></script>
</body>
</html>
